{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <div class="rounded-2xl border border-[var(--slate-200)] bg-white p-8 shadow-sm">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--slate-500)]">Apuesta simple</p>
    <h1 class="mt-2 text-3xl font-extrabold text-[var(--slate-900)]">Confirmar apuesta</h1>

    <div class="mt-6 rounded-2xl border border-[var(--slate-200)] bg-[var(--slate-50)] p-5">
      <p class="text-sm text-[var(--slate-500)]">Evento</p>
      <p class="mt-1 text-lg font-bold text-[var(--slate-900)]">{{ seleccion.event.name|default:seleccion.event }}</p>

      <p class="mt-4 text-sm text-[var(--slate-500)]">Selección</p>
      <p class="mt-1 text-lg font-bold text-[var(--slate-900)]">{{ seleccion.get_selection_display }}</p>

      <p class="mt-4 text-sm text-[var(--slate-500)]">Cuota</p>
      <p class="mt-1 text-2xl font-extrabold text-[var(--slate-900)]">{{ seleccion.decimal_odds }}</p>

      <p class="mt-4 text-sm text-[var(--slate-500)]">Saldo disponible</p>
      <p class="mt-1 text-2xl font-extrabold text-[var(--slate-900)]">{{ saldo }}</p>
    </div>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div>
        <label class="text-sm font-semibold text-[var(--slate-900)]" for="stake">Monto</label>
        <input id="stake" name="stake" type="number" step="0.0001" min="1" placeholder="10.0000" class="mt-2 w-full rounded-xl border border-[var(--slate-200)] px-4 py-3 text-sm font-semibold text-[var(--slate-900)] focus:border-[var(--brand-600)] focus:outline-none" required>
      </div>
      <button class="w-full rounded-full bg-[var(--brand-600)] px-4 py-3 text-sm font-semibold text-white hover:bg-[var(--brand-700)]">Apostar</button>
    </form>
  </div>
</div>
{% endblock %}
